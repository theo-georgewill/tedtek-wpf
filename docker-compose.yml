services:
  postgres:
    image: postgres:17-alpine
    container_name: tedtek-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tedtek_engine
    ports:
      - "5432:5432"
    volumes:
      - tedtek_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tedtek-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tedtek_redis_data:/data

volumes:
  tedtek_postgres_data:
  tedtek_redis_data:
